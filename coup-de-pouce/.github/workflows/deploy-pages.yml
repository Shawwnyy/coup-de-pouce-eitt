# Déploiement optionnel sur GitHub Pages (hébergement statique : le temps réel et les données restent chez Supabase).
# Réglages à faire une fois dans le dépôt :
#   Settings > Pages > Source : « GitHub Actions »
#   Settings > Secrets and variables > Actions > Variables : VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY
# La clé « anon » est publique par conception (elle finit dans le JavaScript du site) ; ne mettez JAMAIS la clé « service_role ».
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Tests unitaires
        run: npm test
      - name: Construire
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
